<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart RAG Document Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .chat-box { height: 420px; overflow-y: auto; background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; }
        .message { margin-bottom: 12px; }
        .user-msg { text-align: right; }
        .user-bubble { display: inline-block; background-color: #0d6efd; color: #fff; padding: 8px 14px; border-radius: 15px 15px 0 15px; max-width: 80%; }
        .ai-msg { text-align: left; }
        .ai-bubble { display: inline-block; background-color: #e9ecef; color: #212529; padding: 8px 14px; border-radius: 15px 15px 15px 0; max-width: 85%; white-space: pre-line; }
        .source-badge { font-size: 0.75rem; background: #6c757d; color: #fff; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Smart RAG Document & Syllabus Assistant</h2>
            <p class="text-muted">Upload course materials and query policies, deadlines, or topics using AI.</p>
        </div>

        <div class="row g-4">
            <!-- Left Column: Document Ingestion -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white fw-semibold">
                        1. Upload Document (PDF)
                    </div>
                    <div class="card-body">
                        <p class="small text-muted">Select a syllabus or lab manual to extract and index text chunks.</p>
                        <div class="mb-3">
                            <input class="form-control" type="file" id="pdfFile" accept=".pdf">
                        </div>
                        <button class="btn btn-primary w-100" id="uploadBtn" onclick="uploadPdf()">Upload & Process</button>
                        
                        <div id="uploadStatus" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Right Column: RAG Chat Interface -->
            <div class="col-md-8">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white fw-semibold">
                        2. Query Document
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div class="chat-box mb-3 flex-grow-1" id="chatBox">
                            <div class="text-center text-muted mt-5">Upload a PDF to start asking questions!</div>
                        </div>

                        <div class="input-group">
                            <input type="text" class="form-control" id="questionInput" placeholder="e.g., What is the late submission policy?" onkeydown="if(event.key==='Enter') sendQuestion()">
                            <button class="btn btn-primary" id="sendBtn" onclick="sendQuestion()">Ask</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isDocumentReady = false;

        async function uploadPdf() {
            const fileInput = document.getElementById('pdfFile');
            const statusDiv = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!fileInput.files.length) {
                statusDiv.innerHTML = '<div class="alert alert-warning py-2 small">Please select a PDF file first.</div>';
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            uploadBtn.disabled = true;
            statusDiv.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div> <span class="small text-muted">Reading PDF and indexing vectors...</span>';
try {
                const response = await fetch('/api/documents/upload', {
                    method: 'POST',
                    body: formData
                });

                // Check if the response is actually JSON before parsing
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const result = await response.json();
                    if (response.ok) {
                        isDocumentReady = true;
                        statusDiv.innerHTML = `<div class="alert alert-success py-2 small">${result.message}</div>`;
                        document.getElementById('chatBox').innerHTML = '<div class="text-center text-success small">Document indexed successfully. Ask your question below!</div>';
                    } else {
                        statusDiv.innerHTML = `<div class="alert alert-danger py-2 small">${result}</div>`;
                    }
                } else {
                    // If it's not JSON, it's a raw server crash message
                    const errorText = await response.text();
                    statusDiv.innerHTML = `<div class="alert alert-danger py-2 small" style="max-height: 100px; overflow-y: auto;">Backend Error: ${errorText}</div>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<div class="alert alert-danger py-2 small">Upload failed: ${err.message}</div>`;
            } finally {
                uploadBtn.disabled = false;
            }
        }

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatBox = document.getElementById('chatBox');
            const question = input.value.trim();

            if (!question) return;

            if (!isDocumentReady) {
                alert("Please upload and process a PDF document first!");
                return;
            }

            // Append user question
            chatBox.innerHTML += `
                <div class="message user-msg">
                    <div class="user-bubble">${escapeHtml(question)}</div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show loading placeholder
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="message ai-msg" id="${loadingId}">
                    <div class="ai-bubble text-muted"><div class="spinner-border spinner-border-sm"></div> Searching context & generating answer...</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                if (res.ok) {
                    let sourcesHtml = '';
                    if (data.sources && data.sources.length) {
                        const pages = [...new Set(data.sources.map(s => s.page))];
                        sourcesHtml = '<div class="mt-2 border-top pt-1 text-muted small"><strong>Sources:</strong> ' + 
                            pages.map(p => `<span class="source-badge">Page ${p}</span>`).join('') + '</div>';
                    }

                    chatBox.innerHTML += `
                        <div class="message ai-msg">
                            <div class="ai-bubble">${escapeHtml(data.answer)}${sourcesHtml}</div>
                        </div>
                    `;
                } else {
                    chatBox.innerHTML += `
                        <div class="message ai-msg">
                            <div class="ai-bubble text-danger">${escapeHtml(data)}</div>
                        </div>
                    `;
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                chatBox.innerHTML += `
                    <div class="message ai-msg">
                        <div class="ai-bubble text-danger">Error: ${err.message}</div>
                    </div>
                `;
            } finally {
                sendBtn.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
